name: Crystal

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        crystal: ["1.15.1", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install Crystal dependencies
        run: shards install
      - name: Generate sources and build
        run: bundle exec rake
      - name: Verify generated sources are committed
        run: git diff --ignore-all-space --ignore-blank-lines --exit-code -- src
      - name: Run PTY regression specs
        run: crystal spec
      - name: Run CLI smoke tests
        run: bundle exec rspec
